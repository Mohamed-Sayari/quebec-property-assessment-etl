services:
  postgres:
    image: postgres:16-alpine
    container_name: quebec_assessment_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
      POSTGRES_DB: quebec_assessment
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d quebec_assessment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: